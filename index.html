<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PVF</title>
  <meta name="description" content="PVF — real-time 3D and VR worlds.">
  <meta name="theme-color" content="#050507">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' fill='%23050507'/><path d='M14 50V14h20a12 12 0 0 1 0 24H24' stroke='%23d4ff3f' stroke-width='7' fill='none'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #050507; --fg: #f2f2ee; --dim: #6c6c78; --acid: #d4ff3f; }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--fg); overflow: hidden; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    .ui { position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr auto;
      padding: clamp(16px, 4vw, 40px); pointer-events: none; }
    .mono { font: 400 12px/1.4 "JetBrains Mono", ui-monospace, monospace; letter-spacing: .12em;
      text-transform: uppercase; color: var(--dim); }
    .top, .bottom { display: flex; justify-content: space-between; gap: 16px; }
    .hero { align-self: end; padding-bottom: clamp(24px, 6vh, 64px); }
    h1 { font: 700 clamp(120px, 34vw, 420px)/.78 "Space Grotesk", system-ui, sans-serif;
      letter-spacing: -.07em; margin-left: -.05em; mix-blend-mode: difference; }
    h1 i { font-style: normal; color: var(--acid); }
    .tag { font: 500 clamp(18px, 2.4vw, 28px)/1.25 "Space Grotesk", system-ui, sans-serif;
      max-width: 22ch; margin-top: 20px; }
    .tag span { color: var(--dim); }
    .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--acid);
      margin-right: 8px; vertical-align: 1px; animation: blink 1.6s steps(2) infinite; }
    @keyframes blink { 50% { opacity: .15; } }
    @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
  </style>
</head>
<body>
  <canvas id="c" aria-hidden="true"></canvas>
  <div class="ui">
    <div class="top mono"><span>pvf.asia</span><span><span class="dot"></span>In development</span></div>
    <div class="hero">
      <h1>PVF<i>.</i></h1>
      <p class="tag">Real-time 3D &amp; VR worlds. <span>Built from modules, shipped as products.</span></p>
    </div>
    <div class="bottom mono"><span>© <span id="y">2026</span></span><span id="coords">00.000 / 00.000</span></div>
  </div>
  <script>
    document.getElementById('y').textContent = new Date().getFullYear();
    const c = document.getElementById('c'), x = c.getContext('2d');
    const coords = document.getElementById('coords');
    const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
    let w, h, dpr, mx = 0, my = 0, tx = 0, ty = 0;
    function size() {
      dpr = Math.min(devicePixelRatio || 1, 2);
      w = c.width = innerWidth * dpr; h = c.height = innerHeight * dpr;
    }
    addEventListener('resize', size); size();
    addEventListener('pointermove', e => { tx = e.clientX / innerWidth - .5; ty = e.clientY / innerHeight - .5; });

    const N = 64, S = 1.6;
    function height(u, v, t) {
      return Math.sin(u * .9 + t) * .35 + Math.cos(v * .7 - t * .8) * .35
           + Math.sin((u + v) * .45 + t * .5) * .5;
    }
    function frame(ms) {
      const t = still ? 0 : ms * .00035;
      mx += (tx - mx) * .04; my += (ty - my) * .04;
      x.fillStyle = '#050507'; x.fillRect(0, 0, w, h);
      const f = Math.min(w, h) * 1.1, yaw = mx * .6, cy = Math.cos(yaw), sy = Math.sin(yaw);
      const camY = 2.4 + my * 1.5, horizon = h * .38;
      for (let j = N - 1; j >= 0; j--) {
        for (let i = 0; i < N; i++) {
          const u = (i - N / 2) * S * .5, v = j * S * .5 + 1 - (t * 2 % (S * .5));
          const px = u * cy - v * sy, pz = u * sy + v * cy;
          if (pz < .4) continue;
          const py = height(u, v + t * 2, t) - camY;
          const sx = w / 2 + px / pz * f, syy = horizon - py / pz * f;
          if (sx < -10 || sx > w + 10 || syy > h + 10) continue;
          const fade = Math.max(0, 1 - pz / (N * S * .5));
          const peak = py + camY > .7;
          x.fillStyle = peak ? `rgba(212,255,63,${fade})` : `rgba(242,242,238,${fade * .55})`;
          const r = Math.max(.6, 2.2 * dpr / pz * 3);
          x.fillRect(sx, syy, r, r);
        }
      }
      coords.textContent = (mx * 90).toFixed(3).padStart(7, '0') + ' / ' + (t * 10 % 100).toFixed(3).padStart(6, '0');
      if (!still) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
