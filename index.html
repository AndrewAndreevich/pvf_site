<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PVF</title>
  <meta name="description" content="PVF — Place-based Virtual Framework. We turn real places into virtual simulations.">
  <meta name="theme-color" content="#050507">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' fill='%23050507'/><path d='M14 50V14h20a12 12 0 0 1 0 24H24' stroke='%23d4ff3f' stroke-width='7' fill='none'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #050507; --fg: #f2f2ee; --dim: #8a8a96; --acid: #d4ff3f; --pad: clamp(16px, 4vw, 40px); }
    * { box-sizing: border-box; margin: 0; }
    html, body { background: var(--bg); color: var(--fg); overflow-x: hidden; }
    body { font-family: "Space Grotesk", system-ui, sans-serif; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }
    main { position: relative; z-index: 1; }
    .hero { min-height: 100svh; display: flex; flex-direction: column; justify-content: flex-end;
      padding: var(--pad); padding-bottom: clamp(40px, 9vh, 96px); }
    h1 { font-weight: 700; font-size: clamp(120px, 34vw, 420px); line-height: .78;
      letter-spacing: -.07em; margin-left: -.05em; }
    h1 i { font-style: normal; color: var(--acid); }
    .tag { font-weight: 500; font-size: clamp(18px, 2.4vw, 28px); line-height: 1.25; margin-top: 20px; }
    .tag b { font-weight: 500; color: var(--acid); }
    .list { list-style: none; padding: 12vh var(--pad) 18vh;
      background: linear-gradient(to bottom, transparent, rgba(5,5,7,.88) 18vh); }
    .list li { display: grid; grid-template-columns: 4ch 1fr; gap: 0 clamp(12px, 3vw, 40px);
      padding: clamp(28px, 6vh, 56px) 0; border-top: 1px solid rgba(242,242,238,.14);
      max-width: 1100px; }
    .list li:last-child { border-bottom: 1px solid rgba(242,242,238,.14); }
    .n { font: 400 13px/2.4 "JetBrains Mono", ui-monospace, monospace; color: var(--acid); }
    .list h2 { font-weight: 700; font-size: clamp(30px, 5.4vw, 68px); line-height: 1; letter-spacing: -.035em; }
    .list p { grid-column: 2; margin-top: 14px; font-size: clamp(16px, 1.7vw, 20px); line-height: 1.45;
      color: var(--dim); max-width: 46ch; }
    .reveal { opacity: 0; transform: translateY(32px); transition: opacity .8s ease, transform .8s cubic-bezier(.2,.7,.2,1); }
    .reveal.in { opacity: 1; transform: none; }
    @media (prefers-reduced-motion: reduce) { .reveal { opacity: 1; transform: none; transition: none; } }
  </style>
</head>
<body>
  <canvas id="c" aria-hidden="true"></canvas>
  <main>
    <section class="hero">
      <h1>PVF<i>.</i></h1>
      <p class="tag"><b>P</b>lace-based <b>V</b>irtual <b>F</b>ramework</p>
    </section>
    <ol class="list">
      <li class="reveal"><h2>Connecting places, people and audiences into living digital twins.</h2>
        <p>Streets, parks and buildings — captured and rebuilt as living, interactive 3D.</p></li>
    </ol>
  </main>
  <script>
    const c = document.getElementById('c'), x = c.getContext('2d');
    const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
    let w, h, dpr, mx = 0, my = 0, tx = 0, ty = 0;
    function size() {
      dpr = Math.min(devicePixelRatio || 1, 2);
      w = c.width = innerWidth * dpr; h = c.height = innerHeight * dpr;
    }
    addEventListener('resize', size); size();
    addEventListener('pointermove', e => { tx = e.clientX / innerWidth - .5; ty = e.clientY / innerHeight - .5; });

    const N = 64, S = 1.6;
    function height(u, v, t) {
      return Math.sin(u * .9 + t) * .35 + Math.cos(v * .7 - t * .8) * .35
           + Math.sin((u + v) * .45 + t * .5) * .5;
    }
    function frame(ms) {
      const t = still ? 0 : ms * .00035;
      mx += (tx - mx) * .04; my += (ty - my) * .04;
      x.fillStyle = '#050507'; x.fillRect(0, 0, w, h);
      const f = Math.min(w, h) * 1.1, yaw = mx * .6, cy = Math.cos(yaw), sy = Math.sin(yaw);
      const camY = 2.2 + my * 1.2, horizon = h * .42, step = S * .5, far = N * step;
      const off = (t * 2) % step;
      // project the grid once, then stroke rows (depth lines) and columns
      const P = [];
      for (let j = 0; j < N; j++) {
        const row = [];
        for (let i = 0; i < N; i++) {
          const u = (i - N / 2) * step, v = j * step + 1 - off;
          const px = u * cy - v * sy, pz = u * sy + v * cy;
          const hy = height(u, v + t * 2, t);
          row.push(pz < .3 ? null : [w / 2 + px / pz * f, horizon - (hy - camY) / pz * f, pz, hy]);
        }
        P.push(row);
      }
      x.lineWidth = dpr;
      for (let j = N - 1; j >= 0; j--) {
        for (let i = 0; i < N - 1; i++) {
          const a = P[j][i], b = P[j][i + 1], d = j + 1 < N ? P[j + 1][i] : null;
          if (!a) continue;
          const fade = Math.max(0, 1 - a[2] / far) ** 1.4;
          x.strokeStyle = a[3] > .55 ? `rgba(212,255,63,${fade * .95})` : `rgba(242,242,238,${fade * .32})`;
          x.beginPath();
          if (b) { x.moveTo(a[0], a[1]); x.lineTo(b[0], b[1]); }
          if (d) { x.moveTo(a[0], a[1]); x.lineTo(d[0], d[1]); }
          x.stroke();
        }
      }
      if (!still) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
    const io = new IntersectionObserver(es => es.forEach(e => {
      if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
    }), { threshold: .25 });
    document.querySelectorAll('.reveal').forEach(el => io.observe(el));
  </script>
</body>
</html>
