<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PVF</title>
  <meta name="description" content="PVF — Place-based Virtual Framework. We turn real places into virtual simulations.">
  <meta name="theme-color" content="#050507">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' fill='%23050507'/><path d='M14 50V14h20a12 12 0 0 1 0 24H24' stroke='%23d4ff3f' stroke-width='7' fill='none'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #050507; --fg: #f2f2ee; --dim: #8a8a96; --acid: #d4ff3f; --pad: clamp(16px, 4vw, 40px); }
    * { box-sizing: border-box; margin: 0; }
    html, body { background: var(--bg); color: var(--fg); overflow-x: hidden; }
    body { font-family: "Space Grotesk", system-ui, sans-serif; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }
    main { position: relative; z-index: 1; }
    .hero { min-height: 100svh; display: flex; flex-direction: column; justify-content: flex-end;
      padding: var(--pad); padding-bottom: clamp(40px, 9vh, 96px); }
    h1 { font-weight: 700; font-size: clamp(120px, 34vw, 420px); line-height: .78;
      letter-spacing: -.07em; margin-left: -.05em; }
    .globe { display: inline-block; width: .2em; height: .2em; margin-left: .03em; vertical-align: baseline;
      position: relative; }
    .globe canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: auto; }
    .tag { font-weight: 500; font-size: clamp(18px, 2.4vw, 28px); line-height: 1.25; margin-top: 20px; }
    .tag b { font-weight: 500; color: var(--acid); }
    .lead { margin-top: 10px; font-size: clamp(15px, 1.5vw, 19px); line-height: 1.4; color: var(--dim); max-width: 40ch; }
  </style>
</head>
<body>
  <canvas id="c" aria-hidden="true"></canvas>
  <main>
    <section class="hero">
      <h1>PVF<span class="globe" aria-hidden="true"><canvas id="g"></canvas></span></h1>
      <p class="tag"><b>P</b>lace-based <b>V</b>irtual <b>F</b>ramework</p>
      <p class="lead">Connecting places, people and audiences into recursive digital twins.</p>
    </section>
  </main>
  <script>
    const c = document.getElementById('c'), x = c.getContext('2d');
    const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
    let w, h, dpr;
    function size() {
      dpr = Math.min(devicePixelRatio || 1, 2);
      w = c.width = innerWidth * dpr; h = c.height = innerHeight * dpr;
    }
    addEventListener('resize', size); size();

    // gentle, plain-like relief: long soft swells, no sharp peaks
    const N = 128, S = .8, BUCKETS = 24;
    function height(u, v, t) {
      return Math.sin(u * .32 + t * .6) * .22 + Math.cos(v * .27 - t * .5) * .2
           + Math.sin((u + v) * .15 + t * .3) * .28 + Math.sin(u * .9 - v * .6 + t) * .05;
    }
    function frame(ms) {
      const t = still ? 0 : ms * .00035;
      x.fillStyle = '#050507'; x.fillRect(0, 0, w, h);
      const f = Math.min(w, h) * 1.1;
      const camY = 1.9, horizon = h * .42, step = S * .5, far = N * step;
      const off = (t * 2) % step;
      const P = [];
      for (let j = 0; j < N; j++) {
        const row = [];
        for (let i = 0; i < N; i++) {
          const u = (i - N / 2) * step, v = j * step + 1 - off;
          const hy = height(u, v + t * 2, t);
          row.push(v < .3 ? null : [w / 2 + u / v * f, horizon - (hy - camY) / v * f, v, hy]);
        }
        P.push(row);
      }
      // each cell gets a smooth 0..1 "greenness" from its average height, so cells fade in and
      // out as the relief scrolls; an edge takes the greener of its two neighbouring cells
      const GL = 8, green = new Float32Array(N * N);
      for (let j = 0; j < N - 1; j++) for (let i = 0; i < N - 1; i++) {
        const q = [P[j][i], P[j][i + 1], P[j + 1][i], P[j + 1][i + 1]];
        if (!q.every(Boolean)) continue;
        const m = Math.min(1, Math.max(0, ((q[0][3] + q[1][3] + q[2][3] + q[3][3]) / 4 - .3) / .3));
        green[j * N + i] = m * m * (3 - 2 * m);
      }
      const gAt = (j, i) => j >= 0 && i >= 0 && j < N - 1 && i < N - 1 ? green[j * N + i] : 0;
      // batch segments by depth fade x green level: a few hundred strokes per frame instead of thousands
      const paths = [];
      for (let k = 0; k < BUCKETS * GL; k++) paths.push(new Path2D());
      for (let j = 0; j < N; j++) {
        for (let i = 0; i < N; i++) {
          const a = P[j][i];
          if (!a) continue;
          const fade = Math.max(0, 1 - a[2] / far) ** 1.4;
          const k = Math.min(BUCKETS - 1, (fade * BUCKETS) | 0);
          if (k === 0) continue;
          const b = i + 1 < N ? P[j][i + 1] : null, d = j + 1 < N ? P[j + 1][i] : null;
          if (b) { const g = Math.max(gAt(j - 1, i), gAt(j, i)), pth = paths[k * GL + Math.round(g * (GL - 1))];
            pth.moveTo(a[0], a[1]); pth.lineTo(b[0], b[1]); }
          if (d) { const g = Math.max(gAt(j, i - 1), gAt(j, i)), pth = paths[k * GL + Math.round(g * (GL - 1))];
            pth.moveTo(a[0], a[1]); pth.lineTo(d[0], d[1]); }
        }
      }
      x.lineWidth = dpr * .7;
      for (let k = 1; k < BUCKETS; k++) {
        const fa = (k + .5) / BUCKETS;
        for (let l = 0; l < GL; l++) {
          const g = l / (GL - 1), pth = paths[k * GL + l];
          if (g < 1) { x.strokeStyle = `rgba(242,242,238,${fa * .3 * (1 - g)})`; x.stroke(pth); }
          if (g > 0) { x.strokeStyle = `rgba(212,255,63,${fa * .95 * g})`; x.stroke(pth); }
        }
      }
      if (!still) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
  <script>
    (async () => {
      const g = document.getElementById('g'), gx = g.getContext('2d');
      const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
      let land = null, size = 0, dpr = 1;
      function fit() {
        dpr = Math.min(devicePixelRatio || 1, 2);
        size = g.parentElement.clientWidth * dpr;
        g.width = g.height = size;
      }
      addEventListener('resize', fit); fit();
      try {
        const topo = await (await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/land-110m.json')).json();
        land = topojson.feature(topo, topo.objects.land);
      } catch (e) {}
      const proj = d3.geoOrthographic().clipAngle(90);
      const path = d3.geoPath(proj, gx);
      function draw(ms) {
        const r = size / 2;
        proj.translate([r, r]).scale(r - dpr).rotate([(still ? 0 : ms * .012) % 360 - 20, -18]);
        gx.clearRect(0, 0, size, size);
        gx.beginPath(); path({ type: 'Sphere' });
        gx.fillStyle = '#050507'; gx.fill();
        if (land) { gx.beginPath(); path(land); gx.fillStyle = '#d4ff3f'; gx.fill(); }
        else { gx.fillStyle = '#d4ff3f'; gx.fill(); }
        gx.beginPath(); path({ type: 'Sphere' });
        gx.strokeStyle = 'rgba(212,255,63,.55)'; gx.lineWidth = Math.max(1, dpr); gx.stroke();
        if (!still) requestAnimationFrame(draw);
      }
      requestAnimationFrame(draw);
    })();
  </script>
</body>
</html>
